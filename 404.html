<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GitHub Pages muestra esta página en cualquier dirección que no exista, a cualquier profundidad,
         así que las rutas relativas se resuelven desde la raíz del sitio: /espacio-anime/ en GitHub Pages
         y / en local. -->
    <script>
        // Red de seguridad: si una franquicia nueva aún no tiene su página generada
        // (tools/generar-fichas.mjs), se abre con la ficha genérica.
        (function () {
            var m = location.pathname.match(/^(.*\/pages\/franquicias\/)([a-z0-9-]+)\.html$/);
            if (m && m[2] !== 'index' && m[2] !== 'ficha') location.replace(m[1] + 'ficha.html?id=' + m[2]);
        })();
        document.write('<base href="' + (location.hostname.endsWith('github.io') ? '/espacio-anime/' : '/') + '">');
    </script>
    <title>Página no encontrada | Espacio Anime</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/favicon/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/img/favicon/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=baaad63634">
</head>

<body class="bg-gray-900 text-white font-sans selection:bg-slate-500 selection:text-white">
    <main class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden bg-[#0b1622] px-6 py-16">
        <img src="assets/img/fondo/fondo1.webp" alt=""
            class="absolute z-10 w-full h-full object-cover object-bottom opacity-40">
        <div
            class="absolute z-20 inset-0 bg-gradient-to-b from-[#0b1622]/80 via-[#0b1622]/40 to-[#0b1622] pointer-events-none">
        </div>

        <div class="relative z-30 flex flex-col items-center text-center max-w-2xl w-full">
            <a href="index.html" class="flex items-baseline gap-1 select-none mb-12">
                <span class="font-black text-2xl md:text-3xl tracking-tighter uppercase text-white pr-1">Espacio</span>
                <span
                    class="font-black text-2xl md:text-3xl tracking-tighter uppercase text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 pl-1 pr-2 pb-1">Anime</span>
            </a>

            <img src="assets/img/favicon/favicon.svg" alt="" class="w-20 h-20 md:w-24 md:h-24 mb-6 drop-shadow-[0_10px_30px_rgba(59,130,246,0.45)]">

            <p
                class="text-7xl md:text-8xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 pb-2">
                404</p>
            <h1
                class="text-2xl md:text-4xl font-black uppercase tracking-tighter mt-2 mb-4 drop-shadow-[0_10px_20px_rgba(0,0,0,0.9)]">
                Esta página se ha perdido en el espacio</h1>
            <p class="text-base md:text-lg text-gray-300 mb-10 drop-shadow-md">
                La dirección que buscas no existe o ha cambiado de sitio. Vuelve a la base y sigue explorando.
            </p>

            <div class="flex flex-wrap justify-center gap-3 w-full">
                <a href="index.html"
                    class="w-full sm:w-auto bg-white/10 border border-white/30 px-6 py-3 rounded-xl backdrop-blur-md hover:bg-white/20 hover:border-white/70 hover:shadow-[0_0_15px_rgba(255,255,255,0.1)] transition-all duration-300 text-xs font-bold uppercase tracking-[0.15em]">
                    Volver al inicio</a>
                <a href="pages/descubrir/index.html"
                    class="w-full sm:w-auto bg-white/5 border border-white/10 px-6 py-3 rounded-xl backdrop-blur-md hover:bg-white/10 hover:border-white/70 transition-all duration-300 text-xs font-bold uppercase tracking-[0.15em] text-slate-200">
                    Descubrir</a>
                <a href="pages/franquicias/index.html"
                    class="w-full sm:w-auto bg-white/5 border border-white/10 px-6 py-3 rounded-xl backdrop-blur-md hover:bg-white/10 hover:border-white/70 transition-all duration-300 text-xs font-bold uppercase tracking-[0.15em] text-slate-200">
                    Franquicias</a>
            </div>
        </div>
    </main>
</body>

</html>
