<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Mismo degradado que "ANIME" en el logo: cyan-400 → blue-500 → purple-500 -->
    <linearGradient id="planeta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1622"/>
  <g transform="rotate(-22 32 32)">
    <!-- Mitad trasera del anillo: queda tapada por el planeta salvo en los extremos -->
    <path d="M4 32 A28 9 0 0 1 60 32" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.55"/>
    <circle cx="32" cy="32" r="17" fill="url(#planeta)"/>
    <!-- Mitad delantera del anillo: pasa por encima del planeta -->
    <path d="M4 32 A28 9 0 0 0 60 32" fill="none" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
