<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha | Espacio Anime</title>
    <meta name="description"
        content="Consulta la ficha completa de esta franquicia en Espacio Anime: sinopsis, dónde verla y todas sus entradas.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        #ficha-contenido.modal-content-franq {
            position: static;
            max-height: none;
            overflow: visible;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>

<body class="bg-gray-900 text-white font-sans selection:bg-slate-500 selection:text-white" id="top">
    <div id="include-nav"></div>

    <main class="pt-28 pb-20">
        <section id="ficha-app" class="container mx-auto px-4 relative z-10">

            <a id="ficha-back-btn" href="index.html" class="back-btn mb-8 inline-flex">← Atrás</a>

            <a id="ficha-nav-prev" href="#" class="ficha-nav-arrow ficha-nav-prev hidden" aria-label="Ficha anterior">‹</a>
            <a id="ficha-nav-next" href="#" class="ficha-nav-arrow ficha-nav-next hidden" aria-label="Ficha siguiente">›</a>

            <div id="ficha-contenido" class="modal-content-franq">
                <div class="modal-header-franq">
                    <div class="modal-left-column">
                        <img id="modalImg" src="" alt="Portada Franquicia">
                        <div id="modalBotonesPrincipales" class="botones-container"></div>
                    </div>
                    <div class="modal-right-column">
                        <h1 id="modalTitulo" class="text-3xl md:text-4xl font-black text-white uppercase tracking-tight mb-6">
                            Cargando...
                        </h1>
                        <div class="modal-tags-franq" id="modalGeneros"></div>
                        <div id="modalAno" class="modal-metadata"></div>
                        <div class="sinopsis-container">
                            <p id="modalSinopsis">Cargando sinopsis...</p>
                        </div>
                    </div>
                </div>

                <div id="modalMiEspacioBar" class="flex items-center justify-around border-y border-white/10 py-5 mb-8"></div>

                <div class="modal-body-franq">
                    <h2>🎬 Entradas de la Franquicia</h2>
                    <div class="entradas-grid" id="modalEntradas"></div>
                </div>
            </div>

            <div id="ficha-no-encontrada" class="hidden flex flex-col items-center justify-center py-32 opacity-60">
                <span class="text-6xl mb-4">🛸</span>
                <p class="font-black uppercase tracking-[0.3em] text-white">Franquicia no encontrada</p>
                <p class="text-sm text-gray-400 mt-2 max-w-md text-center">
                    Puede que el enlace esté mal escrito o que la franquicia ya no exista.
                    <a href="index.html" class="text-white underline hover:text-cyan-400 transition-colors">Vuelve a
                        Franquicias</a>.
                </p>
            </div>

        </section>
    </main>

    <div id="include-footer"></div>

    <script type="module" src="../../assets/js/script.js"></script>
</body>

</html>
